name: Release

# Started by hand from the Actions tab, on dev only.
# Picks the next version from the commits since the package's last tag, updates
# its CHANGELOG.md and package.json, commits and tags that on dev, stages it on
# npm and creates a GitHub release with the same notes. A maintainer then
# approves the staged version on npmjs.com with 2FA to make it public.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        type: choice
        options:
          - common
          - mmd-player
      dry_run:
        description: Dry run (show the version and notes, change nothing)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.package }}
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the release commit and tag, and create the GitHub release.
      id-token: write
    env:
      PACKAGE: ${{ inputs.package }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # Full history and tags, to find the commits since the last release.

      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Use Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "20.20.0"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      # `npm stage` needs npm 11.15.0 or later. Node 20 comes with npm 10.
      - name: Update npm
        run: npm install -g npm@^11.15.0

      - run: pnpm install --frozen-lockfile

      - name: Prepare version and changelog
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs "$PACKAGE" --notes-file "$RUNNER_TEMP/notes.md" $([ "$DRY_RUN" = "true" ] && echo --dry-run)
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      # Build before committing, so a broken build stops the release before anything is pushed.
      - name: Build packages
        if: ${{ !inputs.dry_run }}
        run: pnpm run packages:build

      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "packages/$PACKAGE/package.json" "packages/$PACKAGE/CHANGELOG.md"
          git commit -m "chore($PACKAGE): Release $VERSION."
          git tag -a "$TAG" -m "$TAG"
          # Both or neither, so dev never has a release commit without its tag.
          git push --atomic origin HEAD:dev "refs/tags/$TAG"

      - name: Stage on npm
        if: ${{ !inputs.dry_run }}
        working-directory: packages/${{ inputs.package }}
        # Already built above. Skipping scripts stops `prepare` (git hooks setup) from running.
        run: npm stage publish . --access public --provenance --ignore-scripts

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
